name: Kronos Backtest

on:
  workflow_dispatch:
    inputs:
      universe:
        description: 'Universe to backtest'
        type: choice
        options:
          - stocks
          - etfs
          - crypto
        default: stocks
        required: true
      chunk:
        description: 'Chunk index to run (0-based)'
        type: number
        default: 0
        required: true
      chunks:
        description: 'Total number of chunks'
        type: number
        default: 3
        required: true

# Shares the bot-state group so backtest commits never race trading or daily commits.
concurrency:
  group: kronos-state
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ALPACA_API_KEY_ID: ${{ secrets.ALPACA_API_KEY_ID }}
      ALPACA_API_SECRET_KEY: ${{ secrets.ALPACA_API_SECRET_KEY }}
      GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      ALERT_TO_EMAIL: ${{ secrets.ALERT_TO_EMAIL }}
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      BOT_STATE_DIR: state-repo
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout (default branch)
        uses: actions/checkout@v4

      - name: Bootstrap bot-state branch (first run only)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          git ls-remote --exit-code --heads origin bot-state >/dev/null 2>&1
          rc=$?
          set -e
          if [ "$rc" -eq 0 ]; then
            echo "bot-state branch already exists"
            exit 0
          elif [ "$rc" -ne 2 ]; then
            echo "git ls-remote failed (exit $rc)"
            exit 1
          fi
          BS="$RUNNER_TEMP/bs"
          rm -rf "$BS" && mkdir -p "$BS/state"
          cd "$BS"
          git init -q -b bot-state
          printf '# Kronos bot state\n\nLogs, rankings, metrics and backtest results written by the bot workflows. Do not edit by hand.\n' > README.md
          touch state/.keep
          git add README.md state/.keep
          git -c user.name=kronos-bot -c user.email=kronos-bot@users.noreply.github.com commit -q -m "Bootstrap bot-state branch"
          git push -q "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" bot-state
          echo "Created bot-state branch"

      - name: Checkout bot-state
        uses: actions/checkout@v4
        with:
          ref: bot-state
          path: state-repo

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Cache model weights
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ hashFiles('bot/config.py') }}

      - name: Install dependencies (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r bot/requirements.txt

      - name: Run backtest chunk
        run: python -m bot.backtest --universe ${{ inputs.universe }} --chunk ${{ inputs.chunk }} --chunks ${{ inputs.chunks }}

      - name: Build report (exits 0 and does nothing until all chunks exist)
        run: python -m bot.backtest --universe ${{ inputs.universe }} --report
