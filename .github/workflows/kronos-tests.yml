name: Kronos Tests

on:
  push:
    paths:
      - 'bot/**'
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: bot/requirements.txt

      - name: Install dependencies (offline tests, no torch)
        run: |
          python -m pip install --upgrade pip
          pip install -r bot/requirements.txt

      - name: Run tests
        run: python -m pytest bot/tests -q
